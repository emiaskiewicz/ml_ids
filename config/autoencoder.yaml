experiment:
  name: "AE-21e-tune2"
  random_state: 23

data:
  input_dir: "data/cleaned"
  dataset_variant: "easy"
  target_column: "Target"
  label_column: "Label"
  normal_label: 0

split:
  test_size: 0.2
  val_size: 0.1
  stratify: true
  load_existing_split: true
  split_dir: "data/split/easy/"

features:
  use_network_features: false
  drop_original_port_columns: false
  log_transform: false
  log_transform_columns: "auto"
  remove_correlated_features: false
  correlation_threshold: 0.95
  use_feature_selection: false
  feature_selection_method: "select_k_best"
  selected_k_features: 40
  variance_threshold: 0.0
  scaling: true
  scaler: "standard"

model:
  encoder_layers: [128, 64, 32]
  latent_dim: 8
  activation: "relu"
  output_activation: "none"
  batch_norm: true
  dropout: 0.0
  loss_function: "mse"
  reconstruction_threshold: 0.0568
  learning_rate: 0.001
  batch_size: 4096
  epochs: 200
  weight_decay: 0.0001
  scheduler_enabled: false
  scheduler_factor: 0.5
  scheduler_patience: 5
  scheduler_min_lr: 0.000001
  early_stopping: true
  patience: 10
  min_delta: 0.0001
  device: "auto"
  denoising: false
  noise_std: 0.05

tuning_stage_1:
  enabled: false
  metric: "average_precision"
  param_grid:
    encoder_layers:
      - [128, 64, 32]
    latent_dim: [8]
    dropout: [0.0, 0.001]
    batch_norm: [true]
    learning_rate: [0.001]
    batch_size: [4096]
    weight_decay: [0.0001]
    loss_function: ["mse"]
    scheduler_enabled: [false, true]
    scheduler_factor: [0.5]
    scheduler_patience: [5]
    scheduler_min_lr: [0.000001]
    denoising: [false, true]
    noise_std: [0.02, 0.05, 0.1]

tuning_stage_2:
  enabled: false
  metric: "f1"
  threshold_candidates: 200

output:
  output_dir: "outputs/autoencoder/easy/AE-21e-tune2"
  summary_path: "outputs/autoencoder/easy/ae_e_results_sum.csv"
  save_metrics: true
  save_plots: true
  save_model: true
  save_predictions: true
  save_tuning_results: true
  evaluate_test: false

logging:
  log_path: "logs/autoencoder/easy/AE-21e-tune2.log"
  log_level: "INFO"