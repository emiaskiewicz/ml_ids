experiment:
  name: "MLP-04h-tune"
  random_state: 23

data:
  input_dir: "data/cleaned"
  dataset_variant: "hard"
  target_column: "Target"
  label_column: "Label"

split:
  test_size: 0.2
  val_size: 0.1
  stratify: true
  load_existing_split: true
  split_dir: "data/split/hard/"

features:
  remove_correlated_features: true
  correlation_threshold: 0.95
  use_feature_selection: false
  feature_selection_method: "select_k_best" #"rfe"
  selected_k_features: 40

preprocessing:
  smote: false
  scaling: true
  scaler: "standard"

model:
  hidden_layers: [64, 32]
  activation: "relu"
  dropout: 0.2
  learning_rate: 0.001
  batch_size: 4096
  epochs: 200
  weight_decay: 0.0001
  decision_threshold: 0.5
  device: "auto"
  early_stopping: true
  patience: 5
  min_delta: 0.0001
  use_pos_weight: false
  pos_weight_mode: "auto"
  pos_weight_value: 1.0
  batch_norm: false
  scheduler_enabled: false
  scheduler_factor: 0.5
  scheduler_patience: 2
  scheduler_min_lr: 0.000001

tuning_stage_1:
  enabled: true
  metric: f1
  param_grid:
    hidden_layers:
      - [64, 32]
      - [128, 64]
      - [256, 128, 64]
    activation: ["relu"]
    dropout: [0.1, 0.2]
    batch_norm: [false, true]
    learning_rate: [0.001, 0.0005]
    batch_size: [4096]
    weight_decay: [0.0001]
    use_pos_weight: [false]
    scheduler_enabled: [false]

tuning_stage_2:
  enabled: true
  metric: f1
  threshold_start: 0.1
  threshold_stop: 0.9
  threshold_step: 0.05

output:
  output_dir: "outputs/mlp/hard/MLP-04h-tune"
  summary_path: "outputs/mlp/hard/mlp_h_results_sum.csv"
  save_metrics: true
  save_plots: true
  save_predictions: true
  save_tuning_results: true
  save_best_config: true

logging:
  log_path: "logs/mlp/hard/MLP-04h-tune.log"
  log_level: "INFO"